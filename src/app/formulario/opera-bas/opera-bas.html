<div class="container mt-4">

  <h2>Calculadora</h2>

  <!-- Primer número -->
  <div class="mb-3">
    <label for="num1" class="form-label">
      Primer número
    </label>

    <input
      type="number"
      id="num1"
      class="form-control"
      [(ngModel)]="num1"
    >
  </div>


  <!-- Segundo número -->
  <div class="mb-3">
    <label for="num2" class="form-label">
      Segundo número
    </label>

    <input
      type="number"
      id="num2"
      class="form-control"
      [(ngModel)]="num2"
    >
  </div>


  <!-- Operaciones -->
  <div class="mb-3">

    <h5>Selecciona una operación:</h5>

    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="operacion"
        value="suma"
        [(ngModel)]="operacion"
        id="suma"
      >

      <label class="form-check-label" for="suma">
        Suma
      </label>
    </div>


    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="operacion"
        value="resta"
        [(ngModel)]="operacion"
        id="resta"
      >

      <label class="form-check-label" for="resta">
        Resta
      </label>
    </div>


    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="operacion"
        value="multiplicacion"
        [(ngModel)]="operacion"
        id="multiplicacion"
      >

      <label class="form-check-label" for="multiplicacion">
        Multiplicación
      </label>
    </div>


    <div class="form-check">
      <input
        class="form-check-input"
        type="radio"
        name="operacion"
        value="division"
        [(ngModel)]="operacion"
        id="division"
      >

      <label class="form-check-label" for="division">
        División
      </label>
    </div>

  </div>


  <!-- Botón resultado -->
  <button
    type="button"
    class="btn btn-primary"
    (click)="calcular()"
  >
    Resultado
  </button>


  <!-- Resultado -->
  <div class="mt-4" *ngIf="resultado !== null">

    <h4>Resultado:</h4>

    <p>
      {{ resultado }}
    </p>

  </div>

</div>
